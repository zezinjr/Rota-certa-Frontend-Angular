<div class="auth-page">
  <header class="auth-topbar">
    <div class="logo">
      <div class="logo-dot"></div>
      <span>Rotacerta</span>
    </div>
  </header>

  <main class="auth-content">
    <mat-card class="auth-card">
      <mat-card-header>
        <mat-card-title>Entrar no painel</mat-card-title>
        <mat-card-subtitle>Acesso exclusivo para gestores.</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="outline">
            <mat-label>E-mail corporativo</mat-label>
            <mat-icon matPrefix>email</mat-icon>
            <input matInput type="email" formControlName="email" autocomplete="username" placeholder="matricula@empresa.com">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Senha</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
            <button mat-icon-button matSuffix type="button" (click)="hidePassword.set(!hidePassword())"
                    [attr.aria-label]="hidePassword() ? 'Mostrar senha' : 'Ocultar senha'">
              <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
          </mat-form-field>

          @if (error()) {
            <p class="auth-error" role="alert">{{ error() }}</p>
          }

          <button mat-raised-button color="primary" class="auth-submit" type="submit" [disabled]="form.invalid || loading()">
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Entrar
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </main>

  <p class="auth-footer">Colaboradores e motoristas acessam pelo aplicativo.</p>
</div>
